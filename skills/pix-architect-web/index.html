<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rule-architect - Context Interview</title>
  <link rel="stylesheet" href="/interview.css">
</head>
<body>
  <header data-part="app-header">
    <h1 data-part="app-title">rule-architect</h1>
    <p data-part="app-subtitle">Project Context Interview</p>
    <p data-part="app-desc">Fill in the details about your project to generate <code>.context/</code> architecture documentation.</p>
  </header>

  <main data-part="app-main" id="app">
    <div data-part="wizard-area">
      <context-wizard></context-wizard>
    </div>
    <aside data-part="summary-panel">
      <h3>⚡ Configuration Summary</h3>
      <div data-part="summary-scroll">
        <p data-part="summary-empty">Fill in the interview fields to see a live summary of all choices.</p>
      </div>
    </aside>
  </main>

  <footer data-part="app-footer">
    <p data-part="footer-text">rule-architect - Generated docs will be written to <code id="target-dir">./.context/</code></p>
  </footer>

  <script type="module" src="/interview.js"></script>
</body>
</html>
