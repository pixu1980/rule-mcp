stages:
  - install
  - lint
  - test
  - build
  - docker
  - deploy

variables:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.4.1"
  DOCKER_REGISTRY: "${CI_REGISTRY}"
  DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}"

default:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - node_modules/
    policy: pull
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store

# -------------------------------------------------------------------
# Install
# -------------------------------------------------------------------
install:
  stage: install
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - node_modules/
    policy: pull-push
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# -------------------------------------------------------------------
# Lint
# -------------------------------------------------------------------
lint:
  stage: lint
  needs: ["install"]
  script:
    - pnpm lint

# -------------------------------------------------------------------
# Test
# -------------------------------------------------------------------
test:
  stage: test
  needs: ["install"]
  script:
    - pnpm test:coverage
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days

# -------------------------------------------------------------------
# Build
# -------------------------------------------------------------------
build:
  stage: build
  needs: ["install", "test"]
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# -------------------------------------------------------------------
# Docker
# -------------------------------------------------------------------
docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: ["build"]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
      --file docker/Dockerfile
      --tag "${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --tag "${DOCKER_IMAGE}:latest"
      .
    - docker push "${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${DOCKER_IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -------------------------------------------------------------------
# Deploy
# -------------------------------------------------------------------
.deploy_base:
  stage: deploy
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

deploy:staging:
  extends: .deploy_base
  needs: ["docker"]
  environment:
    name: staging
    url: https://staging.${CI_PROJECT_NAME}.rule-mcp.domain.example
  variables:
    DEPLOY_ENV: staging
    DEPLOY_HOST: "${STAGING_DEPLOY_HOST}"
    DEPLOY_TOKEN: "${STAGING_DEPLOY_TOKEN}"
  script:
    - |
      curl --fail --silent --show-error \
        -X POST \
        -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"tag\": \"${CI_COMMIT_SHORT_SHA}\", \"env\": \"${DEPLOY_ENV}\"}" \
        "https://${DEPLOY_HOST}/api/deploy"

deploy:production:
  extends: .deploy_base
  needs: ["deploy:staging"]
  environment:
    name: production
    url: https://${CI_PROJECT_NAME}.rule-mcp.domain.example
  variables:
    DEPLOY_ENV: production
    DEPLOY_HOST: "${PRODUCTION_DEPLOY_HOST}"
    DEPLOY_TOKEN: "${PRODUCTION_DEPLOY_TOKEN}"
  script:
    - |
      curl --fail --silent --show-error \
        -X POST \
        -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"tag\": \"${CI_COMMIT_SHORT_SHA}\", \"env\": \"${DEPLOY_ENV}\"}" \
        "https://${DEPLOY_HOST}/api/deploy"
