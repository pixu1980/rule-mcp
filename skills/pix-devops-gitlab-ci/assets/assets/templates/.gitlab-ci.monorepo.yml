test:backend:
  stage: test
  needs: ["install"]
  script:
    - pnpm --filter backend-node test:coverage
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: packages/backend-node/coverage/cobertura-coverage.xml

test:frontend:
  stage: test
  needs: ["install"]
  script:
    - pnpm --filter frontend-react-vite test:coverage
