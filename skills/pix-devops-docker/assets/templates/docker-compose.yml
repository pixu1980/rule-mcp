services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    ports:
      - "<dev-port>:<dev-port>"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
    environment:
      NODE_ENV: development
      PORT: "<dev-port>"
      LOG_LEVEL: debug
    command: ["npm", "dev"]
