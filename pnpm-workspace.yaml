allowBuilds:
  "@modelcontextprotocol/inspector": false
minimumReleaseAgeExclude:
  - eslint-plugin-unicorn@75.0.0 || 76.0.0
  - '@modelcontextprotocol/inspector@2.9.0'
  - globals@17.13.0
overrides:
  # Transitive advisories that `@modelcontextprotocol/sdk` has not caught up
  # to. Overrides, not ranges: the pin is the remediation, and the audit gate
  # reads the resolved tree.
  # (GHSA-hrr3-gc8f-f4qj fast-uri: vulnerable range >=3.0.0 <3.1.8)
  rule-mcp: 'link:'
  fast-uri: 3.1.8
