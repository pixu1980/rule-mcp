name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # id-token: write removed (OSS-13) - no job mints OIDC tokens

# The one place the pnpm version lives. `package.json` cannot carry it: the
# manifest guardrail forbids `packageManager` and `devEngines.packageManager`
# (corepack then owns the install and can refuse it offline or behind a proxy).
# Without a version here, pnpm/action-setup fails with "No pnpm version is
# specified" before any job does a single useful thing.
env:
  PNPM_VERSION: "11.25.0"

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Check syntax (all source files)
        run: find bin src -name "*.js" -exec node --check {} \;
      - name: ESLint
        run: pnpm exec eslint bin/ src/ tests/ --max-warnings 50
      - name: Prettier check
        run: pnpm exec prettier --check '**/*.{js,mjs,json,md}' --ignore-path .gitignore
      - name: Version sync
        run: node scripts/build/version/index.mjs --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Run the quick suite (glob runner)
        run: node scripts/ci/run-tests/index.mjs quick

  coverage:
    name: Coverage gate (branch ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Coverage over the full suite (fails under the branch floor)
        run: pnpm test:coverage

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          for commit in $(git rev-list "$base"..HEAD); do
            subject="$(git log -1 --format=%s "$commit")"
            # System-generated messages (merge / revert) are exempt, as in the hook.
            case "$subject" in
              "Merge "*|"Revert "*) continue ;;
            esac
            git log -1 --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^<>]+>$' || { echo "missing Signed-off-by in $commit"; exit 1; }
          done

  license:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Every source file carries an SPDX header
        run: node scripts/reports/license-headers/index.mjs --check

  commit-lint:
    name: Commit lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit follows type(scope)
        run: node scripts/build/commit-types/index.mjs --lint-range "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit gate
        run: pnpm audit:gate
