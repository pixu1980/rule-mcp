name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# The one place the pnpm version lives. `package.json` cannot carry it: the
# manifest guardrail forbids `packageManager` and `devEngines.packageManager`
# (corepack then owns the install and can refuse it offline or behind a proxy).
# Without a version here, pnpm/action-setup fails with "No pnpm version is
# specified" before any job does a single useful thing.
env:
  PNPM_VERSION: "11.25.0"

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Check syntax (all source files)
        run: find bin src -name "*.js" -exec node --check {} \;
      - name: ESLint
        run: pnpm exec eslint bin/ src/ tests/ --max-warnings 50
      - name: Prettier check
        run: pnpm exec prettier --check '**/*.{js,mjs,json,md}' --ignore-path .gitignore

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Run the quick suite (glob runner)
        run: node scripts/ci/run-tests/index.mjs quick

  coverage:
    name: Coverage gate (branch ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Coverage over the full suite (fails under the branch floor)
        run: pnpm test:coverage

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (production)
        run: pnpm audit --prod
