name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the run when the full-history credential scan finds something
        type: boolean
        default: false

permissions:
  contents: read
  # id-token: write removed (OSS-13) - no job mints OIDC tokens

# The one place the pnpm version lives. `package.json` cannot carry it: the
# manifest guardrail forbids `packageManager` and `devEngines.packageManager`
# (corepack then owns the install and can refuse it offline or behind a proxy).
# Without a version here, pnpm/action-setup fails with "No pnpm version is
# specified" before any job does a single useful thing.
env:
  PNPM_VERSION: "11.25.0"

# A newer push supersedes the older run: the older one has nothing to report that
# the newer tip does not. `pages.yml` waits for the conclusion of this workflow,
# so a cancelled run publishes nothing and the run that replaces it publishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Check syntax (all source files)
        run: find bin packages -name "*.js" -exec node --check {} \;
      - name: ESLint
        run: pnpm exec eslint bin/ packages/ scripts/__tests__/ --max-warnings 50
      - name: Prettier check
        run: pnpm exec prettier --check '**/*.{js,mjs,json,md}' --ignore-path .gitignore
      - name: Version sync
        run: node scripts/build/version/index.mjs --check
      # The generated documents must match a fresh generation from the live
      # code. This is the only place that check runs: the test that reads them
      # compares against the checked-in snapshot so a documentation test never
      # has to load the application.
      - name: Census is current
        run: pnpm census:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Pinned and checksum-verified, because this binary decides whether a
      # commit carries a credential: an unverified download would move the
      # trust boundary from the lockfile to whoever answers the release URL.
      - name: Install betterleaks (v2, pinned)
        run: |
          set -euo pipefail
          version="2.0.0-rc.7"
          base="https://github.com/betterleaks/betterleaks/releases/download/v${version}"
          asset="betterleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${asset}" "${base}/${asset}"
          digest="230ef42dc3a0ee35e5148b7b4e9280224a412ef100cd4e74d3d6681d94e6ccb8"
          echo "${digest}  /tmp/${asset}" | sha256sum -c -
          tar xzf "/tmp/${asset}" -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/betterleaks "$HOME/.local/bin/betterleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan the commits this branch adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          BLOCKING: ${{ inputs.blocking }}
        run: |
          set -euo pipefail
          test "$(betterleaks --version)" = "2.0.0-rc.7"
          # A manual run has no event commits and no base to compare against, so
          # it reads the whole history and reports. It blocks only when the run
          # asked for that: the gate that must hold is the one on a push or a
          # pull request, which scans exactly what the change adds.
          advisory=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$BLOCKING" != "true" ]; then
            advisory="1"
          fi
          head="HEAD"
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi
          # New branches, manual runs and unavailable old tips scan full history.
          range="$head"
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            if git cat-file -e "${base}^{commit}" 2>/dev/null; then
              range="${base}..${head}"
            fi
          fi
          # The command caps a patch at 4 MiB, and a full history is larger, so
          # the commits are scanned in windows. A window that is still too large
          # is halved, and a commit that cannot be read is a failed scan rather
          # than a clean one.
          window=120
          mapfile -t commits < <(git rev-list --reverse "$range")
          index=0
          while [ "$index" -lt "${#commits[@]}" ]; do
            end=$((index + window))
            [ "$end" -gt "${#commits[@]}" ] && end="${#commits[@]}"
            if [ "$index" -eq 0 ]; then
              spec="${commits[end - 1]}"
            else
              spec="${commits[index - 1]}..${commits[end - 1]}"
            fi
            if node ./bin/rule-mcp.js secrets --range "$spec"; then
              index="$end"
            else
              status=$?
              # 1 means credentials were found, which is the gate doing its job.
              if [ "$status" -eq 1 ]; then
                if [ -n "$advisory" ]; then
                  echo "::warning::credentials found in ${spec}; this manual run is advisory"
                  index="$end"
                  continue
                fi
                echo "credentials found in ${spec}" >&2
                exit 1
              fi
              if [ "$status" -eq 2 ] && [ "$window" -gt 1 ]; then
                window=$((window / 2))
                continue
              fi
              if [ "$status" -eq 2 ] && [ "$window" -eq 1 ]; then
                # One commit can exceed the cap on its own, a vendored dump for
                # instance. The patch goes to betterleaks directly with the same
                # flags, so the commit is read instead of reported as unreadable.
                if git show --root --format=medium --no-abbrev-commit --diff-merges=first-parent \
                    --no-ext-diff --no-textconv --no-color "${commits[index]}" \
                    | betterleaks stdin --git-diff --redact --no-banner --output=- --exit-code=0 \
                      --validate=false --analyze=false; then
                  index="$end"
                  continue
                fi
              fi
              if [ -n "$advisory" ]; then
                echo "::warning::credential scan could not read ${spec}; this manual run is advisory"
                index="$end"
                continue
              fi
              echo "credential scan could not read ${spec}" >&2
              exit 2
            fi
          done

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Run the quick suite (glob runner)
        run: node scripts/ci/run-tests/index.mjs quick

  coverage:
    name: Coverage gate (branch ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Embed skills
        run: node scripts/build/embed-skills/index.mjs
      - name: Coverage over the full suite (fails under the branch floor)
        run: pnpm test:coverage

  commit-lint:
    name: Commit lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit follows type(scope)
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A manual run carries no base sha, and an empty argument is a usage
          # error rather than a full-history check. The root commit is the base
          # that means "every commit on this branch".
          base="$EVENT_BASE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          node scripts/build/commit-types/index.mjs --lint-range "$base" HEAD

  release-preview:
    name: Release preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # The next version is a function of the commits since the newest tag, so
      # it is derived rather than chosen. This job only reports it: the tag and
      # the release stay on the tag-triggered path in release.yml.
      - name: Next semantic version from the commits
        run: node --import ./scripts/alias-hook.mjs scripts/build/version/index.mjs --next
      # The changelog is generated from the commits, and the release headings
      # come from the tags. A clone without tags cannot define the boundary, so
      # the gate runs only when the tags are there - and then it is a gate.
      - name: Changelog is current when tags define the boundary
        run: |
          if git tag | grep -q .; then
            node --import ./scripts/alias-hook.mjs scripts/build/changelog/index.mjs --check
          else
            echo "no tags in this clone; the changelog boundary is undefined, skipping"
          fi

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dependency audit gate
        run: pnpm audit:gate

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        # Code scanning is not enabled on this repository and the SARIF upload
        # is unavailable on fork pull requests, so stay off Advanced Security
        # and surface findings as annotations instead
        # (scripts/__tests__/docs/workflow-zizmor.test.mjs).
        with:
          advanced-security: false
          annotations: true
