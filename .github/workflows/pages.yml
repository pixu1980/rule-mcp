name: Pages

# The publish waits for `ci` and reads its conclusion, so a red run never ships
# the tree. A push cannot start this workflow on its own.
on:
  # zizmor: ignore[dangerous-triggers] -- the waited run is this repository on main, the guard reads its conclusion, and the checkout takes the head sha it measured, so no fork code reaches this workflow
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in a row publish in order, and the second one does not stop the first.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PNPM_VERSION: "11.25.0"

jobs:
  build:
    # A manual run has no conclusion to read, so it always builds.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The tree the gate measured, not the tip of the default branch.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The site is published only if its own checks pass: layout, contrast,
      # accessibility, text overlap and the page change are measured in a real
      # browser, and a failing one stops the deploy instead of shipping.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the site
        run: pnpm test:e2e:docs-site
      - name: Build the site
        run: pnpm docs:build
      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site-dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
