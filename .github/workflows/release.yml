name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The one place the pnpm version lives for this workflow (mirrors ci.yml).
env:
  PNPM_VERSION: "11.25.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      # No setup-node cache here: this workflow runs on tags, and a cached
      # dependency tree restored into a tag build is a cache-poisoning path.
      # `package-manager-cache` defaults to true, so it must be off explicitly.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # package.json, server.json and CHANGELOG must agree, and the tag must name
      # that version. `pnpm release` writes all of them.
      - name: Version sync
        run: |
          node scripts/build/version/index.mjs --check
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Dependency audit gate
        run: pnpm audit:gate
      - name: Pack the tarball
        run: pnpm build
      - name: Checksum the tarball
        run: cd dist && sha256sum rule-mcp-*.tgz > SHA256SUMS && cat SHA256SUMS
      # npm sbom cannot read a pnpm tree (no package-lock.json), so the SBOM
      # comes from cdxgen, which parses pnpm-lock.yaml. It rides along with
      # `files: dist/*` next to the checksum file.
      - name: Generate the SBOM
        run: pnpx @cyclonedx/cdxgen -t js -o dist/sbom.cdx.json .
      - name: Upload the artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarball
          path: dist/

  verify:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      # No cache here either: the verify job must not restore state from
      # untrusted tag-build caches (see the build job above).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Verify the checksum
        run: cd dist && sha256sum -c SHA256SUMS
      # The tarball is the workspace, so pnpm builds it the way a user does.
      - name: Install the tarball from scratch
        run: |
          rm -rf /tmp/rule-mcp-verify && mkdir -p /tmp/rule-mcp-verify && cd /tmp/rule-mcp-verify
          tar -xzf "$GITHUB_WORKSPACE/dist/rule-mcp-"*.tgz --strip-components=1
          pnpm install --frozen-lockfile
          pnpm docs:build
          node bin/rule-mcp.js --version
          node bin/rule-mcp.js tools list

  release:
    runs-on: ubuntu-latest
    needs: [build, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version sync
        run: node scripts/build/version/index.mjs --check
      - name: Extract changelog entry
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BODY="$(awk -v tag="[$TAG]" '
            BEGIN { in_sec=0 }
            /^## \[/ { if (index($0, tag)) { in_sec=1; next } if (in_sec) exit }
            in_sec { print }
          ' CHANGELOG.md)"
          echo "body<<EOFCHANGELOG" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOFCHANGELOG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 # zizmor: ignore[superfluous-actions] -- pinned SHA with scoped contents:write; keep the audited release path stable
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          files: dist/*
          # Tags with a hyphen (v0.1.0-beta, v1.0.0-rc.1) ship as prereleases;
          # plain tags (v0.1.0, v1.0.0) ship as latest stable releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
