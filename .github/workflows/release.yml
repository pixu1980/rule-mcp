name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract changelog entry
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BODY="$(awk -v tag="[$TAG]" '
            BEGIN { in_sec=0 }
            /^## \[/ { if (index($0, tag)) { in_sec=1; next } if (in_sec) exit }
            in_sec { print }
          ' CHANGELOG.md)"
          echo "body<<EOFCHANGELOG" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOFCHANGELOG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
          # Tags with a hyphen (v0.1.0-beta, v1.0.0-rc.1) ship as prereleases;
          # plain tags (v0.1.0, v1.0.0) ship as latest stable releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
