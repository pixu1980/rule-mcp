name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Tag, package.json, server.json and CHANGELOG must agree; --apply
      # wires into the pack job once Step 6 adds one.
      - name: Version sync
        run: node scripts/build/version/index.mjs --check
      - name: Extract changelog entry
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BODY="$(awk -v tag="[$TAG]" '
            BEGIN { in_sec=0 }
            /^## \[/ { if (index($0, tag)) { in_sec=1; next } if (in_sec) exit }
            in_sec { print }
          ' CHANGELOG.md)"
          echo "body<<EOFCHANGELOG" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOFCHANGELOG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false
